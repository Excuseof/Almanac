<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almanac</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app">
        <section class="auth-box" id="authBox">

            <div id="loginForm">
                <input type="email" id="loginEmailInput" placeholder="Email">
                <input type="password" id="loginPasswordInput" placeholder="Password">

                <button id="loginBtn">Log in</button>
                <button id="showSignupBtn" type="button">Create account</button>
            </div>

            <div id="signupForm" style="display: none;">
                <input type="text" id="displayNameInput" placeholder="Username">
                <input type="email" id="signupEmailInput" placeholder="Email">
                <input type="password" id="signupPasswordInput" placeholder="Password">
                <input type="password" id="passwordConfirmInput" placeholder="Confirm password">

                <button id="signupBtn">Sign up</button>
                <button id="showLoginBtn" type="button">Back to log in</button>
            </div>

        </section>

        <section class="user-box" id="userBox">
            <span id="userEmail"></span>
            <button id="logoutBtn">Log out</button>
        </section>
        <header class="app-header">
            <h1>Almanac</h1>
            <p>Collected over time.</p>
        </header>

        <section class="categories">
            <button class="category-btn active-category" data-category="All">All</button>
            <button class="category-btn" data-category="Away">Away</button>
            <button class="category-btn" data-category="Workroom">Workroom</button>
            <button class="category-btn" data-category="Everyday">Everyday</button>
            <button class="category-btn" data-category="Table">Table</button>
            <button class="category-btn" data-category="Places">Places</button>
            <button class="category-btn" data-category="Notes">Notes</button>
        </section>

        <section class="view-tabs">
            <button id="archiveTab">Archive</button>
            <button id="myTab" class="active-tab">Mine</button>
            <button id="feedTab">Discovery</button>
            <button id="profileTab">Profile</button>
        </section>

        <main id="feedView"></main>

        <section id="archiveView" class="archive-view">
            <div class="archive-header">
                <button id="prevMonthBtn">←</button>
                <h2 id="archiveTitle">June 2026</h2>
                <button id="nextMonthBtn">→</button>
            </div>

            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div id="calendar" class="calendar"></div>
        </section>
        <section id="profileView" class="profile-view">

            <h2>Profile</h2>

            <p id="profileEmail"></p>

            <div class="profile-stats">

                <div class="stat-card">
                    <strong id="profileEntryCount">0</strong>
                    <span>Entries</span>
                </div>

                <div class="stat-card">
                    <strong id="profileCategoryCount">0</strong>
                    <span>Categories</span>
                </div>

            </div>

            <input type="text" id="profileNameInput" placeholder="Username">

            <button id="saveProfileBtn">
                Save Profile
            </button>

        </section>
    </div>

    <button id="addBtn" class="floating-btn">+</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Add Entry</h2>

            <label class="photo-upload">
                <input type="file" id="photoInput" accept="image/*">
                <span>Choose photo</span>
            </label>

            <img id="photoPreview" class="photo-preview" alt="">

            <input type="text" id="title" placeholder="Title" />
            <textarea id="description" placeholder="One sentence..."></textarea>
            <input type="text" id="location" placeholder="Location (optional)" />

            <select id="category">
                <option>Away</option>
                <option>Workroom</option>
                <option>Everyday</option>
                <option>Table</option>
                <option>Places</option>
                <option>Notes</option>
            </select>

            <button id="saveBtn">Save</button>
            <button id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
